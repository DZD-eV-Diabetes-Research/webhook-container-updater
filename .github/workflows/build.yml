name: Build and push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_DZD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DZD_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dzdde/webhook-container-updater
          tags: |
            type=raw,value=latest
            type=sha,prefix=git-,format=short
          labels: |
            org.opencontainers.image.title=webhook-container-updater
            org.opencontainers.image.description=Event-driven Docker container updater triggered by DockerHub webhooks
            org.opencontainers.image.url=https://github.com/DZD-eV-Diabetes-Research/webhook-container-updater
            org.opencontainers.image.source=https://github.com/DZD-eV-Diabetes-Research/webhook-container-updater
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_DZD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DZD_PASSWORD }}
          repository: dzdde/webhook-container-updater
          short-description: "Event-driven container updater triggered by DockerHub webhooks. No polling, no Watchtower."
